<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CunCalc</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f4f7f8} .card{background:white;padding:16px;border-radius:12px;margin:12px 0} button{padding:10px 14px;margin:4px;border:none;background:#0f766e;color:white;border-radius:8px} input{padding:10px;width:100%;box-sizing:border-box} .big{font-size:2em;font-weight:bold}</style></head><body><h1>CunCalc v1</h1><div class="card"><label>3 Cun Width (cm)</label><input id="baseline" type="number" step="0.01"><div id="onecun">1 Cun = -</div></div><div class="card"><label>Target Cun</label><input id="target" type="number" step="0.1" value="1.5"><div class="big" id="result">- cm</div><div id="mm"></div><button onclick="copyResult()">Copy</button><button onclick="resetAll()">New Patient</button></div><div class="card"><h3>Presets</h3><div id="presets"></div></div><div class="card"><h3>Reverse Calculator</h3><input id="cmInput" type="number" step="0.01" placeholder="cm"><div id="cunResult"></div></div><div class="card"><h3>Conversion Table</h3><table id="tbl"></table></div><p><a href="https://wa.link/dnjw13">Enquiries</a></p><script>const p=[0.5,0.7,1,1.5,2,3,4,4.5,6,8,9,12];const baseline=document.getElementById('baseline');const target=document.getElementById('target');function calc(){const b=parseFloat(baseline.value);const t=parseFloat(target.value);if(!(b>0&&t>=0)){return;} localStorage.setItem('baseline',b); document.getElementById('onecun').innerText='1 Cun = '+(b/3).toFixed(2)+' cm'; const r=b/3*t; document.getElementById('result').innerText=r.toFixed(2)+' cm'; document.getElementById('mm').innerText=(r*10).toFixed(1)+' mm'; let h='<tr><th>Cun</th><th>cm</th></tr>'; p.forEach(x=>h+=`<tr><td>${x}</td><td>${(b/3*x).toFixed(2)}</td></tr>`); tbl.innerHTML=h; const cm=parseFloat(document.getElementById('cmInput').value); if(cm>0) document.getElementById('cunResult').innerText=(cm/(b/3)).toFixed(2)+' cun';} p.forEach(v=>{let b=document.createElement('button');b.textContent=v+' cun';b.onclick=()=>{target.value=v;calc();};presets.appendChild(b);}); baseline.value=localStorage.getItem('baseline')||''; baseline.oninput=calc; target.oninput=calc; document.getElementById('cmInput').oninput=calc; function resetAll(){localStorage.removeItem('baseline');baseline.value='';target.value='1.5';document.getElementById('result').innerText='- cm';} function copyResult(){navigator.clipboard.writeText(document.getElementById('result').innerText);} calc();</script></body></html>
